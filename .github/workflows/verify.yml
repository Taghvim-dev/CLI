name: public-cli-verify
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor == '007dude' && startsWith(github.event.head_commit.message, 'T0_CERTIFY_PUBLIC_CLI_20261122') }} # Exact owner-authored main push; disabled on all other events
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          # Proof and tests must execute the exact SHA recorded in the receipt.
          # GitHub's PR default checkout is the synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: T0 attest the executed CLI source identity
        shell: bash
        env:
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_HEAD_SHA"
          test -z "$(git status --porcelain)"
          echo "T0_CLI_SOURCE_HEAD_VERIFIED sha=$SOURCE_HEAD_SHA"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "22"
      - name: License and local contract
        run: |
          grep -q "Apache License" LICENSE
          test -f NOTICE
          node scripts/check-contract.mjs
      - name: Offline CLI tests
        run: npm test
      - name: Source syntax
        run: |
          node --check src/cli.mjs
          node --check bin/taghvim.mjs
      - name: T0 direct CLI to real Cloudflare public API (no test fixtures or credentials)
        shell: bash
        env:
          TAGHVIM_API_BASE_URL: https://api.taghvim.dev
          TAGHVIM_TEST_API_KEY: ""
          TAGHVIM_LIVE_API_KEY: ""
          SOURCE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # Execute the shipped native Node CLI, not a mocked fetch adapter.
          node bin/taghvim.mjs health > "$RUNNER_TEMP/taghvim-cli-health.json"
          node bin/taghvim.mjs versions > "$RUNNER_TEMP/taghvim-cli-versions.json"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const read=file=>JSON.parse(fs.readFileSync(file,'utf8'));
          const h=read(process.env.RUNNER_TEMP+'/taghvim-cli-health.json');
          const v=read(process.env.RUNNER_TEMP+'/taghvim-cli-versions.json');
          for(const [name,receipt] of [['health',h],['versions',v]]){
            assert.equal(receipt.status,200,name+' must answer live HTTP 200');
            assert.ok(receipt.requestId&&typeof receipt.requestId==='string',name+' trace missing');
            assert.ok(receipt.data&&typeof receipt.data==='object',name+' live body absent');
          }
          assert.match(process.env.SOURCE_HEAD_SHA,/^[a-f0-9]{40}$/);
          // The checkout step separately proves the actual on-disk source SHA
          // before any tests or public API calls. This receipt cannot sign a PR
          // synthetic merge commit under the unrelated PR-head identity.
          const evidence={kind:'taghvim.t0.native-cli.live-public-api.v1',source_head_sha:process.env.SOURCE_HEAD_SHA,
            run_id:process.env.GITHUB_RUN_ID,api_origin:'https://api.taghvim.dev',
            credentials:'none',mock_fetch:false,
            operations:[['health',h],['versions',v]].map(([operation,x])=>({operation,http:x.status,request_id:x.requestId})),
            ga_customer_authenticated_cli_verified:false};
          fs.writeFileSync('t0-cli-live-receipt.json',JSON.stringify(evidence,null,2)+'\n');
          console.log('T0_NATIVE_CLI_REAL_CLOUDFLARE_PASS',JSON.stringify({source:evidence.source_head_sha,http:200,operations:2}));
          NODE
      - name: Persist exact-source read-only live CLI receipt
        uses: actions/upload-artifact@v6
        with:
          name: t0-native-cli-live-readonly
          path: t0-cli-live-receipt.json
          retention-days: 30
          if-no-files-found: error
